[package]
name = "mdbook-tsitter"
version = "3.1.0"
edition = "2021"
description = "An mdBook preprocessor that highlights fenced code blocks with tree-sitter, for any language with a tree-sitter grammar."
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlexanderGolys/mdbook-tsitter"
homepage = "https://spectralflux.dev/mdbook-tsitter"
keywords = ["mdbook", "tree-sitter", "syntax-highlighting", "preprocessor"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
# Keep example/test books and repository tooling out of the published
# package — they only make sense from the git repo.
exclude = ["/examples", "/docs", "/xtask", "/.cargo"]

[workspace]
members = ["xtask"]

[[bin]]
name = "mdbook-tsitter"
path = "src/main.rs"

[dependencies]
mdbook-preprocessor = "0.5"
mdbook-markdown = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
semver = "1"
clap = { version = "4", features = ["derive"] }
libloading = "0.8"
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-language = "0.1"
tree-sitter-loader = "0.26"
etcetera = "0.11"
